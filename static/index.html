<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinecrest Trail Co. — Support (demo)</title>
<link rel="icon" href="data:,">
<style>
  :root { --green:#1f5d43; --green-soft:#e7f0eb; --ink:#1d2421; --muted:#66706b; --line:#dfe5e1; --bg:#f6f7f5; --warn:#8a5a00; --warn-soft:#fff4dc; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--green); color:#fff; padding:14px 20px; display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; justify-content:space-between; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header span { font-size:12px; opacity:.8; }
  main { max-width:760px; margin:0 auto; height:calc(100vh - 54px); display:flex; flex-direction:column; }
  #log { flex:1; overflow-y:auto; padding:20px 16px; }
  .msg { width:fit-content; max-width:85%; margin:0 0 14px; padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
  .user { margin-left:auto; background:var(--green); color:#fff; border-bottom-right-radius:4px; }
  .bot { background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bot.not_found, .bot.order_not_verified { background:var(--warn-soft); border-color:#f0d9a8; }
  .badge { display:inline-block; font-size:11px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:var(--green); background:var(--green-soft); border-radius:999px; padding:2px 8px; margin-bottom:6px; }
  .not_found .badge, .order_not_verified .badge { color:var(--warn); background:#fbe7bd; }
  .cites { margin-top:8px; border-top:1px solid var(--line); padding-top:6px; }
  details { font-size:13px; color:var(--muted); margin-top:4px; }
  summary { cursor:pointer; color:var(--green); }
  details p { margin:4px 0 0; padding:6px 8px; background:var(--bg); border-radius:6px; white-space:pre-wrap; }
  #suggest { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 10px; }
  #suggest button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; color:var(--ink); }
  #suggest button:hover { border-color:var(--green); }
  form { display:flex; gap:8px; padding:12px 16px 18px; border-top:1px solid var(--line); background:var(--bg); }
  input { flex:1; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  input:focus { outline:2px solid var(--green); border-color:transparent; }
  form button { background:var(--green); color:#fff; border:0; border-radius:10px; padding:0 18px; font-size:15px; cursor:pointer; }
  form button:disabled { opacity:.5; }
  .typing { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<header><h1>Pinecrest Trail Co. — Support</h1><span>Demo store · answers come only from our help docs</span></header>
<main>
  <div id="log" aria-live="polite"></div>
  <div id="suggest">
    <button>How long does standard shipping take?</button>
    <button>Can I return boots I wore on a hike?</button>
    <button>Where is my order?</button>
    <button>How much is a weekend tent rental?</button>
    <button>Do you sell kayaks?</button>
    <button>I want to talk to a person</button>
  </div>
  <form id="f"><input id="q" placeholder="Ask about orders, shipping, returns, sizing…" autocomplete="off" maxlength="2000"><button id="send">Send</button></form>
</main>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
const session = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).slice(0, 32);
const LABELS = { not_found:'Not in our docs', handoff:'Passed to our team', order_status:'Order status', ask_order_details:'Order lookup', order_not_verified:'Not verified' };

function bubble(cls) { const d = document.createElement('div'); d.className = 'msg ' + cls; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }

// Render **bold** safely: only text nodes, never innerHTML.
function setText(el, text) {
  text.split(/(\*\*[^*]+\*\*)/).forEach(part => {
    if (part.startsWith('**') && part.endsWith('**')) { const b = document.createElement('strong'); b.textContent = part.slice(2, -2); el.appendChild(b); }
    else el.appendChild(document.createTextNode(part));
  });
}

function botMessage(r) {
  const d = bubble('bot ' + r.action);
  if (LABELS[r.action]) { const b = document.createElement('div'); b.className = 'badge'; b.textContent = LABELS[r.action] + (r.ticket_id ? ' · #' + r.ticket_id : ''); d.appendChild(b); d.appendChild(document.createElement('br')); }
  setText(d, r.answer);
  if (r.citations && r.citations.length) {
    const c = document.createElement('div'); c.className = 'cites';
    r.citations.forEach(ct => {
      const det = document.createElement('details'), s = document.createElement('summary'), p = document.createElement('p');
      s.textContent = `Source [${ct.n}]: ${ct.source}` + (ct.page ? ` · page ${ct.page}` : (ct.section ? ` · ${ct.section.split(' › ').pop()}` : ''));
      p.textContent = ct.snippet + (ct.snippet.length >= 220 ? '…' : '');
      det.append(s, p); c.appendChild(det);
    });
    d.appendChild(c);
  }
  log.scrollTop = log.scrollHeight;
}

async function ask(text) {
  if (!text.trim()) return;
  setText(bubble('user'), text); q.value = ''; send.disabled = true;
  const t = bubble('bot typing'); t.textContent = 'Checking our help docs…';
  try {
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ session_id: session, message: text }) });
    t.remove();
    if (!res.ok) { const e = await res.json().catch(() => ({})); botMessage({ answer: e.detail || 'Something went wrong. Please try again.', action:'not_found', citations:[] }); return; }
    botMessage(await res.json());
  } catch { t.remove(); botMessage({ answer:'Connection problem. Please try again.', action:'not_found', citations:[] }); }
  finally { send.disabled = false; q.focus(); }
}

document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
document.querySelectorAll('#suggest button').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
botMessage({ answer:"Hi! I'm the Pinecrest support assistant. Ask me about shipping, returns, sizing, rentals or your order.", action:'answer', citations:[] });
</script>
</body>
</html>
